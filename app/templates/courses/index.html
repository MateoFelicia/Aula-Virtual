{% extends "base.html" %}
{% block title %}Cursos{% endblock %}

{% block content %}
<h1>Cursos</h1>
{% if courses %}
    <ul class="course-list">
        {% for course in courses %}
            <li>{{ course.title }}</li>
        {% endfor %}
    </ul>
{% else %}
    <p>Todavía no hay cursos cargados.</p>
{% endif %}
{% endblock %}
